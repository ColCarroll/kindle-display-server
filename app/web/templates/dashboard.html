{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block header %}{% endblock %}

{% block content %}
<section class="dashboard-section">
    <div id="weather-container"
         hx-get="/partials/weather"
         hx-trigger="load, every 5m"
         hx-swap="innerHTML">
        <!-- Skeleton placeholder matching 2-location weather layout -->
        <div class="weather-skeleton">
            {% for _ in range(2) %}
            <div class="skeleton-location">
                <div class="skeleton-line skeleton-title"></div>
                <div class="skeleton-line skeleton-subtitle"></div>
                <div class="skeleton-chart"></div>
            </div>
            {% if not loop.last %}<hr>{% endif %}
            {% endfor %}
        </div>
    </div>
</section>

<section class="dashboard-section">
    <div id="strava-container"
         hx-get="/partials/strava"
         hx-trigger="load, every 5m"
         hx-swap="innerHTML">
        <span class="loading"></span> Loading running stats...
    </div>
</section>

<section class="dashboard-section">
    <div id="calendar-container"
         hx-get="/partials/calendar"
         hx-trigger="load, every 5m"
         hx-swap="innerHTML">
        <span class="loading"></span> Loading calendar...
    </div>
</section>

<section class="dashboard-section">
    <div id="portfolio-mini-container"
         hx-get="/partials/portfolio"
         hx-trigger="load, every 30m"
         hx-swap="innerHTML">
        <span class="loading"></span>
    </div>
</section>
{% endblock %}
