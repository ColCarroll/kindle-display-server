{% if error %}
<div class="error-message">Vitals unavailable: {{ error }}</div>
{% elif not has_data %}
<p style="color:#aaa;font-size:0.9rem;font-style:italic;">No Garmin vitals yet.</p>
{% else %}
<div class="vitals-card">
<a href="/fitness" class="vitals-link">
    <div class="strava-stats" style="margin-bottom:0.25rem;">
        <div class="strava-stat">
            <div class="strava-stat-value"><strong>Vitals</strong></div>
        </div>
    </div>

    <svg viewBox="0 0 {{ width }} {{ height }}" class="vitals-radar" role="img"
         aria-label="Last night's vitals against the previous six nights">
        <title>{{ last_night.strftime('%a %b %-d') }} (bold) vs. the six nights before</title>

        {# Typical range: the ring between the edges of each vital's personal band #}
        <polygon points="{{ typical_outer }}" fill="#eef3f8"/>
        <polygon points="{{ typical_inner }}" fill="#fffff8"/>
        <polygon points="{{ outer_ring }}" fill="none" stroke="#ebebeb" stroke-width="1"/>
        <polygon points="{{ mid_ring }}" fill="none" stroke="#c9d6e3" stroke-width="1" stroke-dasharray="2,3"/>

        {% for a in axes %}
        <line x1="{{ center[0] }}" y1="{{ center[1] }}" x2="{{ a.spoke[0] }}" y2="{{ a.spoke[1] }}"
              stroke="#ebebeb" stroke-width="1"/>
        <g>
            <title>{{ a.label }}: {{ a.value }} {{ a.unit }}{% if a.flag %} · {{ a.flag }}{% endif %}</title>
            <path transform="translate({{ a.icon_x }},{{ a.icon_y }})" d="{{ a.icon }}"
                  fill="none" stroke="{{ a.color }}" stroke-width="1.4"
                  stroke-linecap="round" stroke-linejoin="round"/>
            <text x="{{ a.text_x }}" y="{{ a.text_y }}" font-size="{{ font_px }}"
                  fill="{{ a.color }}" style="font-variant-numeric: tabular-nums">{{ a.value }}</text>
        </g>
        {% endfor %}

        {# Six earlier nights fade out behind last night #}
        {% for p in polys %}
        <polygon points="{{ p.points }}" fill="none" stroke="#111"
                 stroke-opacity="{{ p.opacity }}" stroke-width="{{ p.width }}"
                 stroke-linejoin="round">
            <title>{{ p.day.strftime('%a %b %-d') }}</title>
        </polygon>
        {% for x, y in p.vertices %}
        <circle cx="{{ x }}" cy="{{ y }}" r="2.5" fill="#111"/>
        {% endfor %}
        {% endfor %}
        {# Strain in the middle: one number for the whole night #}
        {% if strain %}
        <g>
            <title>Strain: average of resting HR, −HRV, respiration and skin temp, in SDs from your baseline</title>
            <text x="{{ center[0] }}" y="{{ center[1] + 5 }}" text-anchor="middle" font-size="17" font-weight="bold"
                  fill="{{ strain.color }}" stroke="#fffff8" stroke-width="4" paint-order="stroke"
                  style="font-variant-numeric: tabular-nums">{{ strain.value }}</text>
        </g>
        {% endif %}
    </svg>
</a>

{# Strain per night, Mon..Sun like the training calendar; tap to mark a night sick #}
<div class="vitals-week">
    {% for day in week %}
    {% include "partials/fitness_week_day.html" %}
    {% endfor %}
</div>
</div>
{% endif %}

<style>
.vitals-link { display: block; color: inherit; text-decoration: none; }
.vitals-link:hover .strava-stat-value strong { text-decoration: underline; }
.vitals-week {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 3px;
    width: 270px;
    max-width: 100%;
}
.vitals-day {
    font: inherit;
    display: flex; flex-direction: column; align-items: center;
    padding: 0.15rem 0;
    border: 1px solid transparent; border-radius: 3px;
    background: transparent; cursor: pointer;
}
.vitals-day:hover { border-color: #ddd; }
.vitals-day.sick { background: #f3dede; }
.vitals-day.last-week { opacity: 0.55; }
.vitals-day-name { font-size: 0.7rem; color: #999; }
.vitals-day.today .vitals-day-name { color: #333; font-weight: bold; }
.vitals-day-strain { font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.vitals-radar { width: 270px; max-width: 100%; height: auto; display: block; }
</style>
