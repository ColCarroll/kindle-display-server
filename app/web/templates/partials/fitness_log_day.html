<div class="fit-log-day{% if 'sick' in day.tags %} is-sick{% endif %}" id="log-{{ day.iso }}">
    <div class="fit-log-date">
        <span class="fit-log-weekday">{{ day.weekday }}</span> {{ day.label }}
        {% if day.big_load %}<span class="fit-log-big" title="Big training day (load {{ day.big_load|round|int }})">▲</span>{% endif %}
    </div>
    <div class="fit-log-strain" title="Strain"
         {% if day.strain %}style="color: {{ day.strain.color }}"{% endif %}>
        {{ day.strain.value if day.strain else "–" }}
    </div>
    <div class="fit-log-tags">
        {% for key, label in tags.items() %}
        <button type="button"
                class="fit-tag fit-tag-{{ key }}{% if key in day.tags %} on{% endif %}"
                hx-post="/partials/fitness-log/{{ day.iso }}/{{ key }}"
                hx-target="#log-{{ day.iso }}"
                hx-swap="outerHTML"
                aria-pressed="{{ 'true' if key in day.tags else 'false' }}">{{ label }}</button>
        {% endfor %}
    </div>
</div>
