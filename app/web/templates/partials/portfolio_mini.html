{% if not has_data %}
<p style="color:#aaa;font-size:0.9rem;font-style:italic;">No portfolio data.</p>
{% else %}
<svg viewBox="0 0 {{ svg_w }} {{ svg_h }}" class="pf-mini-chart" role="img" aria-label="Portfolio 1-month sparkline">
    <defs>
        <linearGradient id="pf-mini-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="{% if perf_positive %}#2a7a2a{% else %}#c44{% endif %}" stop-opacity="0.14"/>
            <stop offset="100%" stop-color="{% if perf_positive %}#2a7a2a{% else %}#c44{% endif %}" stop-opacity="0.01"/>
        </linearGradient>
    </defs>
    <path d="{{ fill_path }}" fill="url(#pf-mini-grad)"/>
    <polyline points="{{ polyline }}"
              fill="none"
              stroke="{% if perf_positive %}#2a7a2a{% else %}#c44{% endif %}"
              stroke-width="1.5"
              stroke-linejoin="round"
              stroke-linecap="round"/>
</svg>
<div class="pf-mini-stats">
    <span class="pf-mini-label">Day</span>
    <span class="pf-mini-val {% if day_positive %}pf-pos{% else %}pf-neg{% endif %}">{{ day_chg_pct if day_chg_pct is not none else "—" }}</span>
    <span class="pf-mini-sep">·</span>
    <span class="pf-mini-label">Month</span>
    <span class="pf-mini-val {% if month_positive %}pf-pos{% else %}pf-neg{% endif %}">{{ month_chg_pct }}</span>
    <a href="/portfolio" class="pf-mini-link">Portfolio →</a>
</div>
{% endif %}
